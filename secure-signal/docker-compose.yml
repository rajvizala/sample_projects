version: "3.9"

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DATABASE_URL=sqlite+aiosqlite:///./securesignal.db
      - MONITORING_INTERVAL=8
      - DEBUG=false
    volumes:
      - backend_data:/app

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001/api
      - NEXT_PUBLIC_WS_URL=ws://localhost:8001
    depends_on:
      - backend

volumes:
  backend_data:
